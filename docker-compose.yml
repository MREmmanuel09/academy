name: academy

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: academy-web:latest
    container_name: academy-web
    restart: unless-stopped
    # `user: "1001:1001"` matches the non-root user created in the
    # Dockerfile. The volume mount below inherits the same ownership so
    # the SQLite file is writable by the app.
    user: "1001:1001"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Absolute file path: drizzle-kit (cwd=/app/packages/db) and the
      # Next.js server (cwd=/app) both see the same DB location.
      DATABASE_URL: ${DATABASE_URL:-file:/app/apps/web/data/prod.db}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_PWA_ENABLED: "true"
      # Skip the interactive seed prompt on first boot.
      CI: "true"
    volumes:
      - academy-data-v2:/app/apps/web/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Postgres for production. Disabled by default.
  # To enable:
  #   1. Uncomment the block below.
  #   2. Set DATABASE_URL=postgresql://academy:${POSTGRES_PASSWORD}@postgres:5432/academy
  #      in the `web` service environment above.
  #   3. `docker compose up -d --build`.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: academy-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: academy
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  #     POSTGRES_DB: academy
  #   volumes:
  #     - academy-pg:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #         cpus: "0.5"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

volumes:
  academy-data-v2:
  # academy-pg:
