name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by deploy.yml so the image build only runs on green CI.
  workflow_call:

concurrency:
  # github.workflow is the CALLER's name when invoked via workflow_call
  # (deploy.yml), so the standalone run and the reusable call never share
  # a group and cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
        env:
          AUTH_SECRET: ci-only-not-used-for-runtime
          NEXT_TELEMETRY_DISABLED: 1

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
